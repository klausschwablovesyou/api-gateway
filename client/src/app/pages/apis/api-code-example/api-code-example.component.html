<nb-card class="code-example-dialog">
  <nb-card-header>
    <div class="header-row">
      <h5>{{ 'ApiManager.CodeExample.Title' | translate }}: {{ api.name }}</h5>
      <nb-select [selected]="selectedLanguage" (selectedChange)="selectedLanguage = $event" size="small">
        <nb-option value="python">Python</nb-option>
        <nb-option value="rust">Rust</nb-option>
      </nb-select>
    </div>
  </nb-card-header>
  <nb-card-body>
    <p class="warning">{{ 'ApiManager.CodeExample.Warning' | translate }}</p>
    <pre><app-code-py *ngIf="selectedLanguage === 'python'" [api]="api" [gatewayUrl]="gatewayUrl"></app-code-py><app-code-rs *ngIf="selectedLanguage === 'rust'" [api]="api" [gatewayUrl]="gatewayUrl"></app-code-rs></pre>
  </nb-card-body>
  <nb-card-footer>
    <div class="button-group">
      <button nbButton status="primary" (click)="copyToClipboard()">
        {{ 'ApiManager.CodeExample.Copy' | translate }}
      </button>
      <button nbButton status="basic" (click)="onClose()">
        {{ 'ApiManager.CodeExample.Close' | translate }}
      </button>
    </div>
  </nb-card-footer>
</nb-card>
