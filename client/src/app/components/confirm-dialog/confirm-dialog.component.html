<nb-card>
  <nb-card-header>
    <h5>{{ title }}</h5>
  </nb-card-header>
  <nb-card-body>
    <p>{{ message }}</p>
  </nb-card-body>
  <nb-card-footer>
    <div class="button-group">
      <button nbButton status="basic" (click)="onCancel()">
        {{ 'Common.Cancel' | translate }}
      </button>
      <button nbButton status="danger" (click)="onConfirm()">
        {{ 'Common.Confirm' | translate }}
      </button>
    </div>
  </nb-card-footer>
</nb-card>
